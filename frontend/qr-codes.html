<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediVerify - QR Codes</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- ==================================================
             SIDEBAR
        =================================================== -->

        <aside class="sidebar">

            <div class="sidebar-logo">

                <h2>MediVerify</h2>

                <p class="role">Manufacturer</p>

                <nav class="sidebar-nav">

                    <a href="dashboard.html">
                        Dashboard
                    </a>

                    <a href="medicines.html">
                        Medicines
                    </a>

                    <a href="batches.html">
                        Batches
                    </a>

                    <a href="qr-codes.html" class="active">
                        QR Codes
                    </a>

                    <a href="lifecycle.html">
                        Lifecycle
                    </a>

                </nav>

            </div>

        </aside>


        <!-- ==================================================
             MAIN CONTENT
        =================================================== -->

        <main class="main-content">

            <div class="page-header">

                <div>
                    <h1>QR Codes</h1>

                    <p>
                        Generated QR codes for serialized medicines
                    </p>
                </div>

            </div>


            <!-- ==================================================
                 QR CODE LIST
            =================================================== -->

            <section class="content-section">

                <div id="qrList">

                    <p>
                        Loading QR codes...
                    </p>

                </div>

            </section>

        </main>

    </div>


    <!-- ==================================================
         QR VIEW MODAL
    =================================================== -->

    <div id="qrModal" class="qr-modal">

        <div class="qr-modal-backdrop"></div>

        <div class="qr-modal-content">

            <button
                type="button"
                id="closeQrModal"
                class="qr-modal-close">
                &times;
            </button>

            <h2>Outer QR Code</h2>

            <p class="qr-modal-subtitle">
                Public medicine verification QR
            </p>

            <div
                id="modalQrCode"
                class="modal-qr-code">
            </div>

            <div class="modal-qr-details">

                <p>
                    <strong>Serial Number:</strong>
                    <span id="modalSerialNumber">-</span>
                </p>

                <p>
                    <strong>Status:</strong>
                    <span id="modalStatus">-</span>
                </p>

            </div>

            <div class="qr-modal-actions">

                <button
                    type="button"
                    id="printSingleQr"
                    class="qr-print-btn">
                    Print QR
                </button>

                <button
                    type="button"
                    id="closeQrModalBottom"
                    class="qr-cancel-btn">
                    Close
                </button>

            </div>

        </div>

    </div>


    <!-- ==================================================
         PRINT AREA
    =================================================== -->

    <div id="qrPrintArea" class="qr-print-area"></div>


    <!-- ==================================================
         SCRIPTS
    =================================================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script src="js/config.js"></script>

    <script src="js/qr-codes.js"></script>

</body>

</html>
